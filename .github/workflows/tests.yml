# Pruebas de cada cambio que no va directo a main: tests unitarios (incluidos los del analizador de
# QR maliciosos y las capturas de Roborazzi) y compilación de depuración. No firma ni publica nada.

name: Pruebas

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE", "examples/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Tests unitarios y compilación
        run: ./gradlew --no-daemon :composeApp:testDebugUnitTest :composeApp:assembleDebug

      - name: Comprobar que el APK sigue sin permiso de Internet
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          perms=$("$aapt" dump permissions composeApp/build/outputs/apk/debug/composeApp-debug.apk)
          echo "$perms"
          if grep -q "android.permission.INTERNET" <<< "$perms"; then
            echo "::error::El APK pide permiso de Internet"; exit 1
          fi

      - name: Detalle de los tests fallidos
        if: failure()
        run: |
          for f in composeApp/build/test-results/testDebugUnitTest/*.xml; do
            grep -q "<failure" "$f" 2>/dev/null || continue
            echo "::group::$f"
            sed -n '/<failure/,/<\/failure>/p' "$f" | head -80
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: informes-tests
          path: composeApp/build/reports/tests/
          retention-days: 7
